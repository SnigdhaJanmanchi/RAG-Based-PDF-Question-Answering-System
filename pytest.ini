[pytest]
markers =
    slow: tests that load the embedding model (first run may download weights)
    live: optional live OpenAI E2E (requires OPENAI_API_KEY; skipped otherwise)
    live_ollama: optional live Ollama E2E (requires local Ollama + model; skipped otherwise)
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
